name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build
        run: python3 build.py
      - name: Test
        run: pytest test_build.py -v
      - name: Snapshot diff check
        run: python3 scripts/diff_check.py
