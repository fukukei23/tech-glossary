id: rust
name: Rust
icon: "🦀"
tagline: "極限のパフォーマンスとメモリ安全性。学習コスト高"
tags:
  fit_for: ["最高速", "メモリ安全", "組み込み"]
  avoid_for: ["学習コスト最高", "開発速度遅め"]

summary:
  quote: "速さと安全性を両立する、最難関の言語"
  body: |
    **所有権システム**という独自機能によりC/C++と同等の速度を持ちながらメモリ安全性を保証。
    ガベージコレクタを持たず実行時オーバーヘッドがほぼゼロ。学習コストは非常に高いが使いこなせれば最強の言語の一つ。

use_cases:
  - title: "組み込みシステム・OS開発"
    desc: "メモリ制約が厳しいデバイスに最適。Linuxカーネルの一部もRustで書かれ始めている。"
  - title: "WebAssembly（Wasm）"
    desc: "ブラウザ上で高速なネイティブコードを動かす仕組み。FigmaのレンダリングエンジンはRust製。"
  - title: "ゲームエンジン・グラフィクス"
    desc: "フレームレートが要求される処理。Bevy（Rust製ゲームエンジン）などが注目されている。"
  - title: "暗号・セキュリティ"
    desc: "メモリ安全性が必須な暗号処理ライブラリ。Cloudflare WorkersのランタイムもRust製。"

compare:
  headers: [Rust, Go, "C/C++"]
  rows:
    - axis: "実行速度"
      values: ["C/C++同等（最速）", "速い", "最速"]
      marks: ["good", "good", "good"]
    - axis: "メモリ安全性"
      values: ["コンパイラが保証", "GCで管理", "手動管理（危険）"]
      marks: ["good", "", "bad"]
    - axis: "学習コスト"
      values: ["非常に高い", "低め", "高い"]
      marks: ["bad", "good", "bad"]
    - axis: "開発スピード"
      values: ["遅め", "速い", "遅め"]
      marks: ["bad", "good", "bad"]
    - axis: "向いている場面"
      values: ["組み込み・Wasm・OS", "高トラフィックAPI", "OS・ドライバ"]
      marks: ["", "", ""]

pros_cons:
  choose: "C/C++の置き換えとして「速くて安全」が必要な場面。メモリリークやバッファオーバーフローをコンパイル時に防げる。長期運用するシステムの信頼性が上がる。"
  avoid: "Web・AI案件のPoCには絶対に向かない。所有権・借用の概念習得に数ヶ月必要。チームにRustが書ける人材を確保することが難しい。"

qa:
  - q: "RustかGoか、どちらを採用しますか？"
    a: "WebAPIやマイクロサービスならGoです。組み込みデバイス・WebAssembly・秒間数十万リクエストを超えるような極限性能が必要な場合にRustを検討します"
  - q: "RustでAIアプリは作れますか？"
    a: "作れますがAIライブラリのエコシステムがPythonに比べて非常に限られます。推論エンジンの高速化部分をRustで書き、インターフェースはPythonというハイブリッドが現実的です"

ecosystem:
  package_manager: "cargo（標準）"
  frameworks:
    - name: "Axum"
      desc: "モジュラーWebフレームワーク・Tokio系・現行主流"
    - name: "Actix-web"
      desc: "高性能Webフレームワーク・アクターモデル・実績あり"
    - name: "Rocket"
      desc: "使いやすさ重視・マクロ豊富"
  major_libs:
    - name: "Tokio"
      desc: "非同期ランタイム・デファクト・async-std 対抗"
    - name: "Serde"
      desc: "シリアライズ/デシリアライズ・ derive・JSON/TOML/YAML"
    - name: "Rayon"
      desc: "データ並列ライブラリ・イテレータの並列化"
    - name: "sqlx"
      desc: "非同期Rust SQL・コンパイル時クエリ検証"
  runtimes:
    - name: "Rust"
      desc: "単一バイナリ・ランタイム不要・GCなし"

code_examples:
  - title: "Hello World"
    code: |
      fn main() { println!("Hello"); }
  - title: "所有権と借用"
    code: |
      let s = String::from("hi");
      let r = &s;           // 借用（不変参照）
      println!("{}", r);
  - title: "Result と ? 演算子"
    code: |
      fn read(path: &str) -> Result<String, io::Error> {
          let s = std::fs::read_to_string(path)?;
          Ok(s)
      }
  - title: "非同期（async/await + Tokio）"
    code: |
      #[tokio::main]
      async fn main() {
          let data = reqwest::get("https://...").await?.text().await?;
      }

learning_roadmap:
  beginner_period: "目安: 〜2-3ヶ月"
  beginner:
    - topic: "基本文法"
      desc: "変数の不変性・match・enum・コレクション"
    - topic: "所有権システム（最重要）"
      desc: "ムーブ・借用・ライフタイムの基本・コンパイラと対話"
    - topic: "cargo と標準ライブラリ"
      desc: "ビルド・テスト・docs.rs・Result/Option"
  intermediate_period: "目安: 〜3-6ヶ月"
  intermediate:
    - topic: "ライフタイム・借用チェッカー"
      desc: "明示的ライフタイム・構造体のライフタイム・戦略"
    - topic: "トレイト・ジェネリクス"
      desc: "trait・impl・境界・動的ディスパッチ（dyn）"
    - topic: "Send/Sync（スレッド安全性）"
      desc: "マーカートレイト・Arc/Mutex・並行安全性の証明"
  advanced_period: "目安: 〜6ヶ月+"
  advanced:
    - topic: "非同期（async/await + Tokio）"
      desc: "Future・ピン留め・ランタイム・select!"
    - topic: "マクロ（macro_rules! / proc-macro）"
      desc: "宣言的マクロ・属性マクロ・derive"
    - topic: "unsafe と FFI"
      desc: "生ポインタ・外部C連携・不変条件の手動維持"

terms:
  - word: "所有権システム"
    def: "Rustの独自機能。メモリの確保と解放をコンパイラが自動検証し、GCなしでメモリ安全性を保証する仕組み"
