id: bash
name: Bash
icon: "🐚"
tagline: "Unix/Linuxの標準シェル。運用自動化・デプロイの必須言語"
tags:
  fit_for:
    - "サーバー運用自動化（systemd・cron）"
    - "CI/CDパイプライン"
    - "デプロイ・ビルドスクリプト"
    - "テキスト処理パイプライン（grep/sed/awk）"
    - "開発環境セットアップ"
  avoid_for:
    - "クロスプラットフォーム GUI アプリ"
    - "大規模アプリケーション本体（中規模以上が限界）"
    - "Windows専用ロジック（PowerShell/Python推奨）"

summary:
  quote: "37年動いたUnix/Linuxの標準シェル。サーバー運用とデプロイの共通語"
  body: |
    **Bash**（Bourne Again SHell）は **1989年** に **Brian Fox** が **GNU Project** 向けに書いたシェルで、`/bin/sh` の代替として公開後、Linux の事実上の標準シェルとして広まった。`sh`（Bourne Shell）の後継に位置づけられ、POSIX シェル標準に**ほぼ準拠**しつつ、**配列・プロセス置換・拡張テスト `[[ ]]`** などの独自拡張を持つ。
    現在（2026年時点）は **GNU Bash 5.x**（5.3 が最新安定版）が大半の Linux ディストリビューションと macOS の標準シェル。macOS は **Catalina（10.15、2019年）以降**デフォルトシェルが **zsh** に切り替わったが、Linux サーバー・コンテナ・CI ランナー・Docker イメージでは依然 **Bash がデフォルト**。
    用途は **サーバー運用自動化**（systemd ユニット・cron）・**CI/CD**（GitHub Actions / GitLab CI の `run:` ブロック）・**デプロイスクリプト**・**ログ集計パイプライン**（grep/awk/sed 連携）と、運用レイヤーの共通語として外せない。**[ShellCheck](https://www.shellcheck.net/)** による静的解析が事実上の標準品質ゲート。

use_cases:
  - title: "サーバー運用自動化（systemd・cron）"
    desc: "systemd の ExecStart や cron のジョブとして、定型的な保守・バックアップ・ログローテーションを Bash で書く。Linux サーバーの運用自動化は Bash から入る。"
  - title: "CI/CD パイプライン（Harness / GitHub Actions / GitLab CI）"
    desc: "GitHub Actions の `run:` ステップ・GitLab CI の `script:`・CircleCI のステップは実質 Bash ランナー。**テスト・ビルド・デプロイ**のオーケストレーションは Bash が事実上の共通語。"
  - title: "デプロイ・ビルドスクリプト"
    desc: "`./deploy.sh` 形式で `set -euo pipefail` を効かせた堅牢スクリプトがデファクト。Docker イメージビルド・DB マイグレーション・Feature Flag のトグル等に利用。"
  - title: "ログ集計・テキスト処理パイプライン"
    desc: "`grep | awk | sed | sort | uniq` のパイプラインは、ログのサマリ・アクセス集計・異常検知で今も最速・最短。`jq` を組み合わせれば JSON も同じ流儀で処理できる。"
  - title: "開発環境セットアップスクリプト"
    desc: "`bin/setup`・`Makefile` のシェル断片・`bootstrap.sh` 等、新しい開発者を最短で立ち上げるためのスクリプトも Bash。mise・asdf のようなバージョンマネージャも Bash で書かれている。"

