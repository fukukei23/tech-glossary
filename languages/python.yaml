id: python
name: Python
icon: "🐍"
tagline: "AIと相性◎。書きやすいが実行速度は遅め"
tags:
  fit_for: ["AI/ML", "データ処理", "スクリプト", "Web API"]
  avoid_for: ["実行速度", "型の曖昧さ"]

summary:
  quote: "人間が読みやすい言語。特にAI・データ処理の業界標準語"
  body: |
    コードが英語の散文に近く初学者でも読みやすい。**PyTorch**・**LangChain**・**FastAPI**
    など主要AIライブラリがすべてPythonに集中しているため、AI案件では事実上の標準。

use_cases:
  - title: "機械学習・深層学習"
    desc: "PyTorch / TensorFlow / scikit-learn が揃っており、モデルのプロトタイプから本番運用まで一貫してPythonで完結できる。"
  - title: "LLMアプリ開発"
    desc: "LangChain / LlamaIndex / OpenAI SDK などのエコシステムが充実。RAGやエージェント構築も得意。"
  - title: "データ分析・可視化"
    desc: "pandas / matplotlib / Jupyter Notebook の組み合わせが業界標準。データサイエンティストの共通言語。"
  - title: "Web API・自動化スクリプト"
    desc: "FastAPI や Flask でAPIサーバーを素早く立ち上げられる。スクレイピングや業務自動化にも使いやすい。"

compare:
  headers: [Python, Go, TypeScript]
  rows:
    - axis: "実行速度"
      values: ["遅め", "速い", "中程度"]
      marks: ["bad", "good", ""]
    - axis: "AI/MLライブラリ"
      values: ["圧倒的に豊富", "ほぼなし", "少ない"]
      marks: ["good", "bad", ""]
    - axis: "学習コスト"
      values: ["低い", "中程度", "中程度"]
      marks: ["good", "", ""]
    - axis: "型安全性"
      values: ["型ヒントあり（任意）", "静的型付け", "静的型付け"]
      marks: ["", "good", "good"]
    - axis: "向いている場面"
      values: ["AI・データ・PoC", "高トラフィックAPI", "Webフロント・フルスタック"]
      marks: ["", "", ""]

pros_cons:
  choose: "AI・機械学習のエコシステムがPythonに一極集中。PoCフェーズでのスピードが最速。書きやすく読みやすいためチームへの展開も容易。"
  avoid: "**高トラフィックAPI**（毎秒数万リクエスト超）はGoやRustが有利。**組み込みシステム**にはメモリ効率が悪すぎる。"

qa:
  - q: "このサービス、スケールしたらPythonで大丈夫ですか？"
    a: "非同期処理（FastAPIのasync/await）とworkerのスケールアウトで多くの場合は対応できます。ただし毎秒数十万リクエスト規模になるならGoへの移行も選択肢に入ります"
  - q: "PoCはPythonでやりましたが、本番もPythonでいいですか？"
    a: "AIモデルの推論を含むなら本番もPythonが現実的です。ただしAPIの外側（ゲートウェイ・ルーティング）はGoを使い分けることも有効です"

ecosystem:
  package_manager: "pip / uv（推奨・高速） / poetry"
  frameworks:
    - name: "FastAPI"
      desc: "モダンASGI Webフレームワーク・型ヒント活用・自動ドキュメント"
    - name: "Django"
      desc: "フルスタックWebフレームワーク・admin/ORM 装備"
    - name: "Flask"
      desc: "軽量マイクロフレームワーク・柔軟"
    - name: "Streamlit"
      desc: "データアプリ構築・MLデモ・少コード"
  major_libs:
    - name: "NumPy / Pandas"
      desc: "数値計算 / データ分析・データサイエンス標準"
    - name: "PyTorch / TensorFlow"
      desc: "ディープラーニング・研究(PyTorch) / 本番(TF)"
    - name: "Pydantic"
      desc: "型安全データモデル・FastAPI の基盤・バリデーション"
    - name: "SQLAlchemy"
      desc: "ORM・Python DB アクセスのデファクト"
  runtimes:
    - name: "CPython"
      desc: "標準実装・参照実装・本番向け"
    - name: "PyPy"
      desc: "JIT・高速・互換性 注意"

code_examples:
  - title: "Hello World"
    code: |
      print("Hello")
  - title: "リスト内包表記"
    code: |
      squares = [x**2 for x in range(10) if x % 2 == 0]
  - title: "dataclass（型付きデータモデル）"
    code: |
      from dataclasses import dataclass
      @dataclass
      class User:
          name: str
          age: int = 0
  - title: "async/await"
    code: |
      import asyncio
      async def fetch(): ...
      async def main():
          await asyncio.gather(fetch(), fetch())

learning_roadmap:
  beginner_period: "目安: 〜2週間"
  beginner:
    - topic: "基本文法・データ型"
      desc: "list/dict/tuple/set・ミュータビリティ・スライス"
    - topic: "関数・制御構文"
      desc: "def・位置/キーワード引数・デフォルト・内包表記"
    - topic: "クラスの基礎"
      desc: "class・self・__init__・インスタンス変数"
  intermediate_period: "目安: 〜1-2ヶ月"
  intermediate:
    - topic: "クラス・継承・dunder"
      desc: "継承・__repr__/__eq__・プロパティ・dataclass"
    - topic: "Pydantic と型ヒント"
      desc: "型安全モデル・FastAPI 接続・バリデーション"
    - topic: "pip / venv と標準ライブラリ"
      desc: "仮想環境・requirements・os/sys/collections"
  advanced_period: "目安: 〜3-6ヶ月"
  advanced:
    - topic: "デコレータ・ジェネレータ"
      desc: "@decorator・yield・遅延評価・functools"
    - topic: "async/await と asyncio"
      desc: "イベントループ・gather・FastAPI 非同期・aiohttp"
    - topic: "メタクラス・ディスクリプタ"
      desc: "type・__init_subclass__・ORM/Django 内部理解"

terms:
  - word: "PyTorch"
    def: "MetaのPython製ディープラーニングフレームワーク。研究から本番まで業界標準"
  - word: "LangChain"
    def: "LLMアプリを素早く組むPython/TSライブラリ。RAGやエージェント機能を提供"
  - word: "FastAPI"
    def: "Python製高速WebフレームワークAPIが簡潔に書ける。Swaggerドキュメントも自動生成"
  - word: "高トラフィックAPI"
    def: "1秒あたり数万〜数十万リクエストを捌く大規模なAPI。PythonよりGoやRustが有利な場面"
  - word: "組み込みシステム"
    def: "家電・車・センサーなど専用ハードに直接乗るソフトウェア。メモリや処理速度に厳しい制約がある"
