id: go
name: "Go（Golang）"
icon: "🔵"
tagline: "シンプルで高速。インフラ・マイクロサービス向き"
tags:
  fit_for: ["高速実行", "並行処理", "シングルバイナリ"]
  avoid_for: ["AIライブラリが少ない", "ジェネリクスが弱め"]

summary:
  quote: "速い・シンプル・並行処理が得意。インフラの言語"
  body: |
    Googleが開発。**静的型付け**でコンパイルが速く、実行バイナリが1ファイルで完結するためデプロイが簡単。
    **ゴルーチン**による並行処理が得意で、Docker・Kubernetes・Terraformなどインフラツールの大半がGoで書かれている。

use_cases:
  - title: "高トラフィックAPIサーバー"
    desc: "毎秒数万〜数十万リクエストを捌く場面でPythonより大幅に有利。メモリ使用量も少ない。"
  - title: "インフラ・CLIツール"
    desc: "シングルバイナリで配布できるためサーバーへのデプロイやCLIツール配布が非常に簡単。"
  - title: "マイクロサービス"
    desc: "軽量で起動が速く、コンテナ（Docker）との相性が良い。gRPCとの組み合わせが定番。"
  - title: "有名事例"
    desc: "Docker・Kubernetes・Terraform・Grafana・Uber（APIゲートウェイ）・Dropbox（高性能部分）"

compare:
  headers: [Go, Python, Rust]
  rows:
    - axis: "実行速度"
      values: ["速い", "遅め", "最速クラス"]
      marks: ["good", "bad", "good"]
    - axis: "学習コスト"
      values: ["低め", "低い", "非常に高い"]
      marks: ["good", "good", "bad"]
    - axis: "並行処理"
      values: ["ゴルーチンで容易", "asyncio（やや難）", "安全だが複雑"]
      marks: ["good", "", ""]
    - axis: "メモリ管理"
      values: ["GC（自動）", "GC（自動）", "手動（安全）"]
      marks: ["", "", "good"]
    - axis: "向いている場面"
      values: ["高トラフィックAPI・インフラ", "AI・PoC", "組み込み・OS"]
      marks: ["", "", ""]

pros_cons:
  choose: "大量リクエストを捌くAPIに最適。シングルバイナリでデプロイが楽。Rustほど難しくなく、Pythonより速い「ちょうどいい」言語。"
  avoid: "AIアプリのPoCフェーズでは選ばない。Pythonライブラリ（PyTorch等）のエコシステムに勝てない。ジェネリクスが弱く抽象的な設計が難しい場面も。"

qa:
  - q: "APIサーバー、PythonからGoに移行する必要ありますか？"
    a: "現状のトラフィックが問題なければ不要です。ただしPythonのFastAPIで毎秒1万リクエスト超になってきたら、GoへのAPIゲートウェイ移行を検討するタイミングです"
  - q: "GoとRustどちらを選びますか？"
    a: "ほとんどのWebサービス・API用途ではGoで十分です。ゲームエンジン・組み込みデバイス・WebAssemblyが必要な場合にRustを選びます"

ecosystem:
  package_manager: "go mod（標準）"
  frameworks:
    - name: "Gin"
      desc: "軽量HTTP Webフレームワーク・API向け"
    - name: "Echo"
      desc: "高性能HTTPフレームワーク・ミドルウェア豊富"
    - name: "chi"
      desc: "軽量ルーター・標準ライブラリ重視"
    - name: "Fiber"
      desc: "Express風API・fasthttpベース・高速"
  major_libs:
    - name: "gRPC-Go"
      desc: "RPCフレームワーク・Protocol Buffers・マイクロサービス"
    - name: "gorm"
      desc: "ORM・マイグレーション・クエリビルダー"
    - name: "cobra"
      desc: "CLIフレームワーク・サブコマンド・フラグ"
    - name: "viper"
      desc: "設定管理・複数形式（YAML/ENV/flag）"
  runtimes:
    - name: "Go"
      desc: "単一バイナリ・ランタイム不要・クロスコンパイル"

code_examples:
  - title: "Hello World"
    code: |
      package main
      import "fmt"
      func main() { fmt.Println("Hello") }
  - title: "goroutine と channel"
    code: |
      ch := make(chan int)
      go func() { ch <- 42 }()
      fmt.Println(<-ch)
  - title: "context によるキャンセル伝播"
    code: |
      ctx, cancel := context.WithCancel(context.Background())
      defer cancel()
      select { case <-ctx.Done(): return }

learning_roadmap:
  beginner_period: "目安: 〜2週間"
  beginner:
    - topic: "基本文法・構造体・インターフェース"
      desc: "ポインタの理解・struct・interface の暗黙実装"
    - topic: "go mod によるパッケージ管理"
      desc: "go.mod / go.sum・モジュールミラーリング"
    - topic: "エラーハンドリング"
      desc: "error 型・if err != nil・errors.Is/As"
  intermediate_period: "目安: 〜1-2ヶ月"
  intermediate:
    - topic: "goroutine と channel（並行処理）"
      desc: "CSPモデル・select・sync パッケージ・race detector"
    - topic: "context パッケージ"
      desc: "キャンセル/タイムアウト伝播・value 受け渡し・実務必須"
    - topic: "標準ライブラリ"
      desc: "net/http・database/sql・encoding/json・testing"
  advanced_period: "目安: 〜3-6ヶ月"
  advanced:
    - topic: "ジェネリクス（Go 1.18+）"
      desc: "型パラメータ・制約・型推論"
    - topic: "パフォーマンス最適化"
      desc: "pprof・ベンチマーク・アロケーション削減・sync.Pool"
    - topic: "分散システム"
      desc: "gRPC・サービスメッシュ・オブザーバビリティ"

terms:
  - word: "静的型付け"
    def: "コードを実行する前にデータの型を確認する仕組み。バグを事前に検出できる"
  - word: "ゴルーチン"
    def: "Goの軽量な並行処理の単位。OSスレッドより数千倍軽く、大量リクエストを効率よく処理できる"
