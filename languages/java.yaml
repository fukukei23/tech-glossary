id: java
name: Java
icon: "☕"
tagline: "エンタープライズ不動の王者。JVM・Spring・Android"
tags:
  fit_for:
    - "大規模基幹システム"
    - "Androidアプリ"
    - "ミッションクリティカル"
  avoid_for:
    - "軽量スクリプトには過剰"
    - "起動が遅い（コンテナと微妙）"

summary:
  quote: "25年動いた王道の言語。Write Once, Run Anywhere の原典"
  body: |
    1995年 Sun Microsystems で James Gosling らが公開したオブジェクト指向言語。**JVM**（Java仮想マシン）上で動き、ソースを一度コンパイルすればバイトコードがあらゆるプラットフォームで走る「**Write Once, Run Anywhere**」を理念とする。
    **Spring Framework** がデファクトスタンダードとなった2000年代以降は、銀行・証券・保険・官公庁の**ミッションクリティカル**領域で事実上の標準。かつては **Android** の公式言語だったが、2017年に **Kotlin** にメインの座を譲った（既存Android資産は今も大半がJava）。
    現在も **6ヶ月ごとのリリースサイクル**で進化を続け、**Virtual Threads**（Java 21）・**GraalVM ネイティブイメージ**などクラウド時代への対応も進んでいる。

use_cases:
  - title: "エンタープライズWeb（Spring Boot）"
    desc: "Spring Framework が事実上の標準で、銀行・官公庁の大規模Webサービス・マイクロサービスに使用される。組み込みTomcatで即起動。"
  - title: "Androidアプリ（既存資産）"
    desc: "2017年まで Google 公式言語。Kotlin への移行が進む中でも、数百万の既存Androidアプリ・ライブラリは今もJava製。"
  - title: "大規模基幹システム"
    desc: "販売管理・在庫管理・ERP・勘定系など長期保守前提の業務系システムに強く、25年スケールで動く実績がある。"
  - title: "ビッグデータ・分散処理"
    desc: "Hadoop / Spark / Kafka / Flink といった JVM 系ビッグデータツールの事実上の開発言語。JVMエコシステムの恩恵を直接受けられる。"
  - title: "クラウドネイティブ（Quarkus / Micronaut）"
    desc: "Quarkus 等の Kubernetes Native Framework で **GraalVM ネイティブビルド** すれば起動は数10ms・メモリも大幅削減。クラウド時代に再注目。"

