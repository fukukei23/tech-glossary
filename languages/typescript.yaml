id: typescript
name: TypeScript
icon: "🔷"
tagline: "JavaScriptに型を追加。フロント/バックエンド両対応"
tags:
  fit_for: ["フロントエンド", "サーバーサイド", "型安全"]
  avoid_for: ["設定が複雑", "ビルドが必要"]

summary:
  quote: "JavaScriptの信頼できる版。Webの実質標準語"
  body: |
    Microsoftが開発。JavaScriptに**静的型付け**を加えたスーパーセット。
    フロントエンド（React/Next.js）からバックエンド（Node.js）、
    **MCPサーバー**まで同じ言語で書ける。

use_cases:
  - title: "Webフロントエンド"
    desc: "React / Next.js との組み合わせが業界標準。型安全なUIコンポーネントを構築できる。"
  - title: "Node.jsサーバー"
    desc: "Express / Fastify / NestJS などでAPIサーバーやBFFを構築。フロントと言語を統一できるメリットが大きい。"
  - title: "MCPサーバー・CLIツール"
    desc: "Claude Code の拡張（MCPサーバー）の公式SDKがTypeScript製。AIツール開発の主力言語になりつつある。"
  - title: "フルスタック開発"
    desc: "Next.js App Router でフロント・バック・DB操作をすべてTypeScriptで統一する「T3スタック」が人気。"

compare:
  headers: [TypeScript, Python, Go]
  rows:
    - axis: "フロントエンド対応"
      values: ["得意（唯一の選択肢）", "非対応", "非対応"]
      marks: ["good", "bad", "bad"]
    - axis: "型安全性"
      values: ["強い", "型ヒント（任意）", "強い"]
      marks: ["good", "", "good"]
    - axis: "AI/MLライブラリ"
      values: ["少ない", "圧倒的に豊富", "ほぼなし"]
      marks: ["", "good", "bad"]
    - axis: "設定の複雑さ"
      values: ["tsconfig等が必要", "シンプル", "シンプル"]
      marks: ["bad", "good", "good"]
    - axis: "向いている場面"
      values: ["Webアプリ・フルスタック", "AI・データ・PoC", "高トラフィックAPI"]
      marks: ["", "", ""]

pros_cons:
  choose: "フロントとバックを同じ言語で書けるためチームの認知コストが下がる。型エラーでバグを事前検出。Webサービス開発では現実的に最有力。"
  avoid: "小さなスクリプトや自動化ツールにはオーバーキル。AIモデル推論など計算集約タスクはPythonの方が圧倒的にライブラリが充実。"

qa:
  - q: "JavaScriptじゃなくTypeScriptを使う理由は？"
    a: "型定義によりIDEの補完が効き、実行前にバグを検出できます。チームが大きくなるほど恩恵が増します。現在のWebプロジェクトでTypeScriptを使わない理由の方が少ないです"
  - q: "Next.jsとExpressどちらを選びますか？"
    a: "フロント込みのWebサービスならNext.js（App Router）で統一するのが今の主流です。APIだけ提供するマイクロサービスにはExpressやFastifyが軽量で適しています"

ecosystem:
  package_manager: "npm / pnpm（推奨） / yarn (Berry)"
  frameworks:
    - name: "Next.js"
      desc: "フルスタックWebフレームワーク・App Router・SSR/SSG・Vercel製"
    - name: "React"
      desc: "UIライブラリ・デファクト・JSX仮想DOM"
    - name: "NestJS"
      desc: "エンタープライズ向けNodeフレームワーク・DI・Angular影響"
    - name: "Remix"
      desc: "Web標準重視のフルスタック・nested routing"
  major_libs:
    - name: "Prisma"
      desc: "型安全ORM・マイグレーション付き・DBスキーマから型生成"
    - name: "Zod"
      desc: "TypeScriptファーストのスキーマバリデーション・実行時型検査"
    - name: "tRPC"
      desc: "エンドツーエンド型安全API・クライアント自動型生成"
    - name: "Vitest"
      desc: "Viteベースのテストランナー・Jest互換・ESネイティブ"
  runtimes:
    - name: "Node.js"
      desc: "本番標準・LTS運用"
    - name: "Bun"
      desc: "高速・ネイティブTS実行・npm互換"
    - name: "Deno"
      desc: "セキュア・TSネイティブ・Web標準準拠"

code_examples:
  - title: "Hello World + 型"
    code: |
      const greeting: string = "Hello";
      console.log(greeting);
  - title: "async/await と型"
    code: |
      async function fetchUser(id: number): Promise<User> {
        const res = await fetch(`/api/users/${id}`);
        return res.json();
      }
  - title: "ジェネリクス（型の再利用）"
    code: |
      function first<T>(arr: T[]): T | undefined {
        return arr[0];
      }
  - title: "ユーティリティ型（Partial）"
    code: |
      type UserUpdate = Partial<User>;  // 全フィールド任意に
      function updateUser(id: number, patch: UserUpdate) { ... }

learning_roadmap:
  beginner_period: "目安: 〜2週間"
  beginner:
    - topic: "型システム基本"
      desc: "primitives / union / intersection・type alias vs interface"
    - topic: "tsconfig.json"
      desc: "strict / target / module・noImplicitAny の意味"
    - topic: "VSCode + TS 開発環境"
      desc: "tsserver・インレイヒント・quick fix"
  intermediate_period: "目安: 〜1-2ヶ月"
  intermediate:
    - topic: "ジェネリクス・ユーティリティ型"
      desc: "Partial/Pick/Omit/Record・型の再利用"
    - topic: "strict モード完全理解"
      desc: "noUncheckedIndexedAccess・exactOptionalPropertyTypes 等"
    - topic: "型推論の限界と型アサーション"
      desc: "as の用法と乱用避ける・Type Guards"
  advanced_period: "目安: 〜3-6ヶ月"
  advanced:
    - topic: "Conditional Types"
      desc: "T extends U ? X : Y・infer・分配的"
    - topic: "Mapped Types / Template Literal Types"
      desc: "{ [K in keyof T]: ... }・型レベル文字列操作"
    - topic: "型レベルプログラミング"
      desc: "ts-toolbelt・type-fest・再帰型"

terms:
  - word: "静的型付け"
    def: "コードを実行する前にデータの型を確認する仕組み。バグを事前に検出できる"
  - word: "MCPサーバー"
    def: "Model Context Protocol サーバー。ClaudeなどのAIにツールや外部機能を提供する仕組み"
