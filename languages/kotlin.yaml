      values: ["中（Java 経験者は習得しやすい）", "高（記法冗長・25年蓄積の概念）", "高（関数型・ implicit・型理論が難しい）"]
      marks: ["good", "", "bad"]
    - axis: "関数型プログラミング"
      values: ["対応（不変 val・高階関数・関数参照）", "限定的（Stream API・ラムダ）", "対応（本流・For 内包表記・モナド指向）"]
