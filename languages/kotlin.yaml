id: kotlin
name: Kotlin
icon: "🟣"
tagline: "Javaの後継・Android公式言語・モダン簡潔・null安全・Coroutines"
tags:
  fit_for:
    - "Androidアプリ（現行公式）"
    - "サーバーサイド（Ktor / Spring Boot）"
    - "Kotlin Multiplatform（iOS / JS / Desktop 共有コード）"
    - "Null安全性が重要な業務システム"
    - "モダンJVM（Java 資産活用）"
  avoid_for:
    - "ビルド速度が最重要（Gradle 設定の重さが課題）"
    - "現メンバーが Java も Kotlin も読めない"
    - "レガシー JVM 環境（古い Android・Java 6 など）で動かす必要がある場合"

summary:
  quote: "15年動いたモダンJVM。Javaの冗長さを解消し、Android公式となった"
  body: |
    **Kotlin** は **2011年** に **JetBrains**（IntelliJ IDEA の開発元）が公開した静的型付け言語で、JVM・Android・JS・Native（LLVM）のマルチプラットフォーム対応が最大の特徴。**Android** は **2017年**のGoogle I/O で「Kotlin 公式言語」化、**2019年**に「**Kotlin-first**」を宣言し、Google が Android 開発で Kotlin を推奨する立場が公式化している。
    言語設計は **Java の上位互換** を意図し、`val`/`var`・**Null安全**（`String?` vs `String`）・**data class**・**拡張関数**・**Coroutines**（軽量スレッド）・**when式**・**sealed class** などを導入して Java の冗長さを解消した。**Java 資産（ライブラリ・JVM ツール）は全てそのまま呼べる**ため、Spring Boot・Hibernate 等を Kotlin から活用する事例が急増している。
    2024年に **Kotlin 2.0** がリリースされ、**K2 コンパイラ** が安定版に到達してコンパイル速度・IDE 性能が大幅向上した。**Compose Multiplatform** で Desktop・iOS の UI も Kotlin で書けるようになり、サーバーサイド・モバイル・デスクトップの**言語統一**が現実的な選択肢になりつつある。

use_cases:
  - title: "Androidアプリ（現行公式）"
    desc: "Google 公式推奨の Android 開発言語。**Jetpack Compose**（宣言的 UI）・**Coroutines**（非同期）・**ViewModel/LiveData** 等を Kotlin で書くのが標準。Android 開発新規プロジェクトのデファクト。"
  - title: "サーバーサイド（Ktor / Spring Boot）"
    desc: "**Ktor**（JetBrains 製・軽量 Web フレームワーク）または **Spring Boot**（Java 資産をそのまま活用）で REST API・マイクロサービスを Kotlin で実装。**Coroutines** で非同期処理が直感的に書ける。"
  - title: "Kotlin Multiplatform（iOS / JS / Desktop 共有コード）"
    desc: "**KMP** で iOS・Android・Web（JVM/JS）・Desktop の**共通ロジック**を Kotlin 単一コードで共有。UI は各プラットフォームネイティブ、共通処理（API・データ層）は Kotlin で書いて工数削減。"
  - title: "CLI / ツール（Kotlin Script）"
    desc: "`kotlinc -script` で **Kotlin Script**（`.kts`）を実行可能。Gradle の `build.gradle.kts` も Kotlin DSL で書かれ、ビルドスクリプト・運用ツール・データ処理スクリプトとしても活用。"
  - title: "data class を多用する業務システム"
    desc: "DTO・値オブジェクトを `data class` で**自動生成**（equals/hashCode/toString/copy）。JSON シリアライズは **kotlinx.serialization** で簡潔。Java と比べてボイラープレートが激減する。"

