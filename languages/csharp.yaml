id: csharp
name: "C#"
icon: "💎"
tagline: "Microsoft主力言語。.NET・Unity・Azure"
tags:
  fit_for:
    - "Web API（ASP.NET Core）"
    - "ゲーム開発（Unity）"
    - "Microsoft/Azure環境"
  avoid_for:
    - "超軽量スクリプトには過剰"
    - ".NET Framework（Windowsのみ）は新規非推奨"

summary:
  quote: "26年進化するMicrosoft主力言語。.NET・Unity・Azureを縦断"
  body: |
    2000年に **Anders Hejlsberg**（Delphi/Turbo Pascal の作者）が Microsoft で公開したオブジェクト指向言語。**ECMA-335**（Common Language Infrastructure）に準拠し、**JIT コンパイル**で動く **.NET** プラットフォームの主力言語として設計された。**Visual Studio** と **.NET Framework** の組み合わせで Windows デスクトップ開発の標準となり、2014年の **.NET Core** 公開以降は **クロスプラットフォーム対応・OSS化** が急速に進んだ。
    現在（2026年）は **.NET 8 LTS / .NET 9 / .NET 10** 世代で **C# 14** が最新。**Nullable Reference Types**（null安全）・**async/await**（非同期）・**LINQ**（コレクション関数型操作）・**record 型**（イミュータブルデータ）・**Source Generator** など、Java や Kotlin と並ぶ近代的な機能を備える。
    用途は **ASP.NET Core**（Web API）・**Unity**（ゲーム・世界で最も使われているゲームエンジン）・**.NET MAUI**（モバイル/デスクトップ）・**Azure 連携**（クラウド）と極めて広く、Microsoft エコシステムの中心。

use_cases:
  - title: "Web API（ASP.NET Core）"
    desc: "ASP.NET Core は高パフォーマンスなクロスプラットフォーム Web フレームワーク。Microsoft の docs で『最速の .NET Web フレームワーク』とされ、**Minimal API**・**gRPC**・**SignalR** まで一通り揃う。"
  - title: "ゲーム開発（Unity）"
    desc: "Unity は C# を公式スクリプト言語として採用。世界シェア最大級のゲームエンジンで、スマホ・インディー・VR/AR まで C# で開発される。**Unity 6** が現行（2025年公開）。"
  - title: "クラウド / Azure 連携"
    desc: "Azure SDK for .NET・**Aspire**（クラウドネイティブアプリスタック）・Azure Functions・Cosmos DB 等、Microsoft Azure サービス群のファーストクラス言語。"
  - title: "デスクトップ・モバイル（.NET MAUI）"
    desc: ".NET MAUI で Windows / macOS / iOS / Android を単一コードでターゲティング。レガシーでは WPF / WinForms も現役。"
  - title: "CLI / Worker Service / IoT"
    desc: ".NET は **Ahead-of-Time コンパイル（NativeAOT）** 対応で、シングルバイナリの CLI や Linux Worker Service を高速起動できる。ML.NET で機械学習も .NET 完結。"

