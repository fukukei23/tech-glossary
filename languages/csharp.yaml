  headers: ["C#", "Java", "TypeScript"]
  rows:
    - axis: "言語の歴史"
      values: ["26年(2000-)・MS主力", "31年(1995-)・JVMの原点", "13年(2012-)・JS拡張・MS製"]
      marks: ["", "", ""]
    - axis: "型システム"
      values: ["強い静的型・null安全（NRT）", "強い静的型・null安全（@NotNull等）", "構造的型・any/unknown"]
      marks: ["good", "good", "bad"]
    - axis: "クロスプラットフォーム"
      values: [".NET 8+で完全対応（Win/macOS/Linux）", "JVMで完全対応", "ブラウザ+Node.js/Deno/Bun"]
      marks: ["good", "good", "good"]
    - axis: "ゲーム開発"
      values: ["Unity公式・世界最大シェア", "非対応（libGDX等は代替）", "非対応（Phaser等は代替）"]
      marks: ["good", "bad", "bad"]
    - axis: "エコシステム規模"
      values: ["巨大（NuGet・MS支援）", "最大（Maven Central・25年蓄積）", "巨大（npm）"]
      marks: ["good", "good", "good"]
    - axis: "Web フレームワーク"
      values: ["ASP.NET Core（高パフォーマンス）", "Spring Boot（業界標準）", "Next.js / Express 等"]
      marks: ["good", "good", "good"]
    - axis: "向いている場面"
      values: ["Microsoft/Azure環境・Unity・Web API", "大規模基幹・Android（既存）", "Webフロント・フルスタック"]
      marks: ["", "", ""]

pros_cons:
  choose: "**Microsoft エコシステム（.NET・Azure・Visual Studio・Unity）との統合度が最強クラス**。ASP.NET Core は TechEmpower ベンチマークで常に最上位。**Nullable Reference Types** による null 安全性・**async/await** の言語サポート・**LINQ** の表現力・**record 型** の簡潔さはモダンな書き心地を実現。Unity 公式・Azure ファーストクラス採用・NativeAOT で起動高速。Visual Studio のデバッグ体験は業界屈指。"
  avoid: "**Microsoft エコシステム外**では .NET の恩恵が薄く、Linux サーバ運用は依然 Java/Go/Rust に劣る場面も。**.NET Framework（Windows のみ）は廃止予定**で新規採用不可、**.NET 8 以降**を選ぶ必要。Mono は歴史あるが .NET 主流への移行が推奨。学習コストは中程度（Java/C++ 経験者には馴染みやすい）。"

qa:
  - q: "C# と .NET の違いは何ですか？"
    a: "**C# は言語**、**.NET は実行プラットフォーム（CLR + ライブラリ群）** です。.NET 上で動く言語は C# の他に **F#**（関数型）・**VB.NET**（レガシー）等があります。.NET の現在の主流実装は **.NET 8 LTS / .NET 9 / .NET 10**（.NET Core 系）。.NET Framework は Windows のみの旧実装で現在 **廃止予定（out of support）**。"
  - q: "ASP.NET Core と ASP.NET（Framework）の違いは？"
    a: "**ASP.NET Core** は **.NET Core 系（.NET 8+）** で動くクロスプラットフォーム・OSS の現行フレームワーク。**ASP.NET Framework**（旧）は **.NET Framework** 上で動く Windows 専用で、新規開発は非推奨です。新規プロジェクトは必ず ASP.NET Core を選んでください。"
  - q: "Unity で C# を使う時の注意点は？"
    a: "Unity は独自バージョンの C#（Unity 6 では **C# 9** 相当）を採用しており、最新機能（records・init-only 等）はすぐには使えません。Unity 標準ライブラリは .NET Standard 2.1 プロファイルで、.NET 標準 API の一部は利用不可。**async/await・LINQ は使える**ので基本機能は揃います。"
  - q: ".NET のバージョンはどれを選べばいいですか？"
    a: "新規プロジェクトは **.NET 8 LTS**（長期サポート・2026年11月までサポート）または最新 LTS を選んでください。**.NET 9 / 10** は STS（短期サポート）で 18ヶ月サポート。**.NET Framework（4.x）は新規開発不可**。Microsoft のリリースポリシーは毎年11月に新バージョンが公開され、偶数番号が LTS・奇数番号が STS。"
  - q: "NativeAOT とは何ですか？"
    a: "**.NET 9 で正式サポート**された **Ahead-of-Time コンパイル**。ビルド時にネイティブバイナリを生成し、**.NET アプリ起動を数十ms** に短縮・メモリ使用量を大幅に削減できる。CLI・サーバーレス・コンテナ・Worker Service で有利。EF Core や ASP.NET Core の一部は NativeAOT 対応済み。"

ecosystem:
  package_manager: "NuGet（.NET の公式パッケージマネージャ・公式 registry は nuget.org）"
  frameworks:
    - name: "ASP.NET Core"
      desc: "Microsoft公式の高パフォーマンス Web フレームワーク。**Minimal API**・MVC・Razor Pages・gRPC・SignalR を内蔵（.NET 8+ で現行）"
    - name: ".NET MAUI"
      desc: "マルチプラットフォーム UI フレームワーク。Windows / macOS / iOS / Android を単一コードでターゲティング（Xamarin.Forms の後継）"
    - name: "Blazor"
      desc: "C# で **SPA・インタラクティブ Web UI** を書くフレームワーク。**Blazor United**（SSR + インタラクティブ統合）が現行"
    - name: "Unity"
      desc: "世界シェア最大級のゲームエンジン。**C# を公式スクリプト言語**として採用。2D/3D・VR/AR・モバイル・コンソール対応"
    - name: "WPF / WinForms"
      desc: "Windows デスクトップアプリの伝統的フレームワーク。レガシー Windows アプリ保守では現役（.NET 8 で Windows 専用継続）"
    - name: "Entity Framework Core"
      desc: "Microsoft公式 ORM。LINQ で DB クエリを書け、Code First / Database First 両対応（EF Core 9 が現行）"
  major_libs:
    - name: "xUnit / NUnit / MSTest"
      desc: ".NET 公式・第三者製の単体テストフレームワーク。**xUnit** がモダン・.NET チーム推奨。NUnit はレガシー資産に豊富"
    - name: "MediatR"
      desc: "**CQRS / Mediator パターン**のデファクトライブラリ。ASP.NET Core のクリーンアーキテクチャで頻出"
    - name: "Serilog / NLog"
      desc: "構造化ロギングライブラリ。**Serilog** が .NET 8+ で人気、sink 拡張で ElasticSearch / Seq / コンソールに出力"
    - name: "AutoMapper"
      desc: "オブジェクトマッピングライブラリ。DTO ⇔ EntityModel の変換を簡略化"
    - name: "FluentValidation"
      desc: "流れるようなインターフェースでバリデーションルールを定義。ASP.NET Core と組み合わせて入力検証"
    - name: "Polly"
      desc: "**レジリエンス（リトライ・サーキットブレーカー・タイムアウト）**ライブラリ。HTTP 呼び出しの堅牢化に必須"
  runtimes:
    - name: ".NET 8 LTS"
      desc: "現行 LTS。**2023年11月公開・2026年11月までサポート**。本番新規プロジェクトの第一推奨"
    - name: ".NET 9 / .NET 10"
      desc: "現行 STS。.NET 9 は **2024年11月公開・2026年5月までサポート**。.NET 10 は **2025年11月公開**（LTS に昇格予定）"
    - name: ".NET Framework 4.x"
      desc: "Windows のみの旧実装。**新規開発不可・廃止予定**。既存資産の保守目的のみ"
    - name: "Mono"
      desc: "クロスプラットフォームの旧ランタイム。**Unity が内部利用**。Xamarin モバイルも Mono ベースだったが .NET 8 + MAUI に統合"

code_examples:
  - title: "Hello World（クラス + Main）"
    code: |
      using System;

      class Program
      {
          static void Main()
          {
              Console.WriteLine("Hello, C#!");
          }
      }
  - title: "async/await（非同期処理）"
    code: |
      using System.Net.Http;
      using System.Threading.Tasks;

      async Task<string> FetchAsync(string url)
      {
          using var client = new HttpClient();
          string body = await client.GetStringAsync(url);
          return body;
      }
  - title: "LINQ（コレクション関数型操作）"
    code: |
      using System.Linq;

      var topScorers = users
          .Where(u => u.IsActive)
          .OrderByDescending(u => u.Score)
          .Take(10)
          .Select(u => u.Name)
          .ToList();
  - title: "record 型（イミュータブルデータ・C# 9+）"
    code: |
      public record Point(int X, int Y);
      public record User(string Name, int Age);

      var p = new Point(1, 2);
      var p2 = p with { X = 3 };  // with 式で非破壊更新
  - title: "インターフェース + DI（ASP.NET Core風）"
    code: |
      public interface IUserRepository
      {
          Task<User?> GetByIdAsync(int id);
      }

      public class UserService(IUserRepository repo)
      {
          public async Task<string> GetNameAsync(int id)
          {
              var user = await repo.GetByIdAsync(id);
              return user?.Name ?? "anonymous";
          }
      }

      // Program.cs（DI 登録）
      builder.Services.AddScoped<IUserRepository, UserRepository>();

learning_roadmap:
  beginner_period: "目安: 〜2-3週間"
  beginner:
    - topic: "基本文法（変数・制御構文・メソッド）"
      desc: "int/string/配列・if/for/while・メソッド定義・Main"
    - topic: "クラスとオブジェクト指向"
      desc: "class・フィールド・コンストラクタ・アクセス修飾子（public/private）・this"
    - topic: "プロパティ・自動実装プロパティ"
      desc: "get/set・自動実装・init-only・records 入門"
    - topic: "ビルドツール基礎"
      desc: "dotnet CLI（dotnet new / build / run）・.csproj・NuGet パッケージ参照"
  intermediate_period: "目安: 〜1-3ヶ月"
  intermediate:
    - topic: "コレクションと Generics"
      desc: "List<T> / Dictionary<TKey, TValue> / IEnumerable<T>・LINQ 基礎"
    - topic: "例外処理"
      desc: "try-catch-finally・throw・カスタム例外・using ステートメント"
    - topic: "async/await と Task"
      desc: "Task・async・await・ConfigureAwait・HttpClient の使い方"
    - topic: "Nullable Reference Types（NRT）"
      desc: "? 演算子・! 演算子・null 安全性・null forgiving 演算子"
  advanced_period: "目安: 〜3-6ヶ月"
  advanced:
    - topic: "ASP.NET Core 実践"
      desc: "DI コンテナ・ミドルウェア・Minimal API・EF Core・Authorization"
    - topic: "async best practices（Stephen Cleary）"
      desc: "ConfigureAwait・ValueTask・キャンセル・並列制御・async void の罠"
    - topic: "Source Generators"
      desc: "コンパイル時コード生成・Roslyn・partial class・自動実装"
    - topic: ".NET internals"
      desc: "CLR・GC（ワークステーション/サーバー）・JIT・Tiered Compilation・NativeAOT"

terms:
  - word: ".NET"
    def: "Microsoft のアプリケーションプラットフォーム。CLR（共通言語ランタイム）+ 標準ライブラリ群。現行は .NET 8 LTS。.NET Framework（Windows のみ）は廃止予定"
  - word: "CLR"
    def: "Common Language Runtime。.NET の実行エンジン。JIT コンパイル・GC・例外処理・セキュリティを担う。Java の JVM に相当"
  - word: "NuGet"
    def: ".NET の公式パッケージマネージャ・nuget.org がレジストリ。dotnet add package / .csproj の PackageReference で参照"
  - word: "LINQ"
    def: "Language Integrated Query。C# 言語に統合されたクエリ構文。コレクション・DB・XML を統一的な記法で扱える（Select/Where/OrderBy）"
  - word: "async-await"
    def: "C# 5（2012）で導入された非同期構文。Task ベースの非 I/O ブロックを直感的に書ける。.NET の非同期 I/O の基盤"
  - word: "record"
    def: "C# 9 で導入された参照型の値セマンティクス。イミュータブルデータを簡潔に定義でき、with 式で非破壊更新が可能"
  - word: "Nullable Reference Types"
    def: "C# 8 で導入された null 安全機能。string（非 null）と string?（null 許容）を型システムで区別し、コンパイル時に警告"